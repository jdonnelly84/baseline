name: probe-live
on:
  push:
    paths: ['.github/workflows/probe-live.yml', 'probe/live.mjs']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i --no-save playwright-core@1.49.1
        working-directory: probe
      - name: Real Chrome reading ATP's live feed
        run: node live.mjs
        working-directory: probe
