<body>

    <header class="top" id="top"></header>

<script>window.BASELINE_DATA_URL = "https://raw.githubusercontent.com/jdonnelly84/baseline/data/data.json"; window.BASELINE_BUILD = "202611190557"; window.BASELINE_ALERTS = "https://baseline-alerts.jdonnelly84.workers.dev";</script>
<script src="pwa-loader.js?v=202611190557"></script>
<script src="app.js?v=202611190557"></script>
<script>
// Android (Chrome, Samsung Internet): offer to install Baseline as an app with one tap. Chrome hands the page an
// install prompt; where a browser doesn't, show where its own menu option is.
(function () {
  if (!/Android/i.test(navigator.userAgent) || matchMedia('(display-mode: standalone)').matches) return;
  try { if (localStorage.getItem('baseline.installHint') === 'no') return; } catch (e) {}
  var prompt = null, box = null;
  function close(forGood) { if (box) box.remove(); box = null; if (forGood) try { localStorage.setItem('baseline.installHint', 'no'); } catch (e) {} }
  function show(html, withButton) {
    close(false);
    box = document.createElement('div');
    box.setAttribute('style', 'position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:50;background:#1a1f6e;color:#fff;border-radius:16px;padding:14px 44px 14px 14px;font:15px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)');
    box.innerHTML = html + (withButton ? '<div style="margin-top:10px"><button data-install style="background:#fff;color:#1a1f6e;border:0;border-radius:10px;padding:10px 18px;font:700 15px system-ui,sans-serif">Install Baseline</button></div>' : '') +
      '<button aria-label="Close" data-x style="position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:24px;line-height:1;padding:6px">&times;</button>';
    box.querySelector('[data-x]').onclick = function () { close(true); };
    var b = box.querySelector('[data-install]');
    if (b) b.onclick = function () { if (!prompt) return; prompt.prompt(); prompt.userChoice.then(function (c) { if (c && c.outcome === 'accepted') close(true); }); prompt = null; };
    document.body.appendChild(box);
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); prompt = e; show('<b>Get Baseline as an app</b><br>It opens full-screen from your home screen and can send you alerts for your players.', true); });
  window.addEventListener('appinstalled', function () { close(true); });
  setTimeout(function () {
    if (prompt || box) return;
    var samsung = /SamsungBrowser/i.test(navigator.userAgent);
    show('<b>Get Baseline as an app</b><br>' + (samsung ? 'Tap the menu button (&#9776;) at the bottom, then <b>Add page to</b> &rarr; <b>Home screen</b>.' : 'Tap the menu (&#8942;) at the top right, then <b>Add to home screen</b> &rarr; <b>Install</b>.'), false);
  }, 3500);
})();
// Opened in Safari on an iPhone rather than from a Home Screen web app: explain how to add it properly.
(function () {
  var ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (!ios || navigator.standalone || matchMedia('(display-mode: standalone)').matches) return;
  try { if (sessionStorage.getItem('baseline.hint') === 'no') return; } catch (e) {}
  var b = document.createElement('div');
  b.setAttribute('style', 'position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:50;background:#1a1f6e;color:#fff;border-radius:14px;padding:12px 40px 12px 14px;font:14px/1.35 -apple-system,system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)');
  b.innerHTML = '<b>Open Baseline full-screen</b><br>Tap Share <span aria-hidden="true">&#x2191;</span> &rarr; <b>Add to Home Screen</b>, turn on <b>Open as Web App</b>, then tap Add. Delete any older Baseline icon first.<button aria-label="Close" style="position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:22px;line-height:1;padding:4px">&times;</button>';
  b.querySelector('button').onclick = function () { b.remove(); try { sessionStorage.setItem('baseline.hint', 'no'); } catch (e) {} };
  document.body.appendChild(b);
})();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
